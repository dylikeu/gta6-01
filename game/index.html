<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLARA — Streets of Coral Bay</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f2e; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #ui { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  #ui button { pointer-events: auto; }
  .hidden { display: none !important; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  /* --- HUD frame --- */
  #hud { position: absolute; inset: 0; }
  #top-left { position: absolute; top: 14px; left: 16px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  #stars { font-size: 30px; letter-spacing: 4px; line-height: 1; }
  #stars .star { color: rgba(255,255,255,.28); }
  #stars .star.lit { color: #ffb62e; text-shadow: 0 0 12px #ff8a00, 0 2px 4px rgba(0,0,0,.7); }
  #money { font-size: 30px; font-weight: 800; color: #7dff9e; margin-top: 2px; }
  #mission-name { font-size: 13px; font-weight: 700; letter-spacing: 2px; color: #ffd166; margin-top: 2px; }
  #top-right { position: absolute; top: 14px; right: 16px; }
  #minimap { width: 220px; height: 220px; border: 3px solid rgba(255,255,255,.55); border-radius: 50%; box-shadow: 0 4px 18px rgba(0,0,0,.6); background: #081422; }
  #objective { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); max-width: 46%; text-align: center; font-size: 16px; font-weight: 700; background: rgba(10,10,24,.62); border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 8px 16px; text-shadow: 0 1px 3px #000; }
  #toasts { position: absolute; top: 74px; left: 50%; transform: translateX(-50%); text-align: center; }
  .toast { background: rgba(10,10,24,.72); border-left: 4px solid #ffd166; border-radius: 6px; padding: 7px 14px; margin-top: 6px; font-size: 14px; font-weight: 600; display: inline-block; clear: both; }
  .toast.good { border-left-color: #7dff9e; }
  .toast.bad { border-left-color: #ff4d4d; }
  #bottom-left { position: absolute; left: 16px; bottom: 16px; width: 260px; text-shadow: 0 1px 4px #000; }
  .bar-label { font-size: 11px; font-weight: 800; letter-spacing: 2px; margin: 6px 0 3px; }
  .bar { height: 14px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.4); border-radius: 7px; overflow: hidden; }
  #health-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff5a4d, #ff8a5c); transition: width .2s; }
  #armor-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4da3ff, #7fd4ff); transition: width .2s; }
  #bottom-right { position: absolute; right: 16px; bottom: 16px; text-align: right; text-shadow: 0 1px 4px #000; }
  #weapon { font-size: 17px; font-weight: 800; letter-spacing: 1px; }
  #radio { font-size: 14px; color: #ffd166; font-weight: 700; margin-top: 4px; }
  #hint { font-size: 12px; color: rgba(255,255,255,.75); margin-top: 4px; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 26px; font-weight: 300; color: rgba(255,255,255,.9); text-shadow: 0 0 6px #000; }

  /* --- Dialogue --- */
  #dialogue { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%); width: min(680px, 86%); display: flex; gap: 14px; background: rgba(12,10,28,.88); border: 1px solid rgba(255,209,102,.55); border-radius: 12px; padding: 14px 18px; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  #portrait { width: 64px; height: 64px; flex: none; border-radius: 50%; background: #e63b2e; display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 800; border: 3px solid rgba(255,255,255,.7); }
  #dialogue-name { font-size: 15px; font-weight: 800; color: #ffd166; letter-spacing: 1px; }
  #dialogue-text { font-size: 17px; line-height: 1.45; margin-top: 4px; }
  #dialogue-next { font-size: 12px; color: rgba(255,255,255,.6); margin-top: 8px; text-align: right; }

  /* --- Centre banner --- */
  #center-banner { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); text-align: center; text-shadow: 0 3px 12px #000; }
  .banner-title { font-size: 44px; font-weight: 900; letter-spacing: 4px; color: #ffd166; }
  .banner-sub { font-size: 20px; font-weight: 700; margin-top: 4px; }

  /* --- Screens: menu / pause / end --- */
  .screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; background: linear-gradient(180deg, rgba(26,10,46,.42) 0%, rgba(26,10,46,.78) 100%); padding: 20px; }
  .title-block { max-width: 720px; }
  .kicker { font-size: 14px; font-weight: 800; letter-spacing: 6px; color: #ffd166; }
  h1 { font-size: 96px; line-height: 0.95; margin: 10px 0 0; letter-spacing: 8px; font-weight: 900; color: #fff; text-shadow: 0 0 34px rgba(255,122,61,.85), 0 4px 0 #e63b2e, 0 8px 24px rgba(0,0,0,.7); }
  .subtitle { font-size: 22px; letter-spacing: 4px; color: #ffb59e; font-weight: 700; margin-top: 6px; }
  .tagline { font-size: 17px; line-height: 1.5; color: #f5e6ff; margin: 18px 0 6px; }
  .menu-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin: 20px 0 10px; }
  .menu-buttons button { font-size: 17px; font-weight: 800; letter-spacing: 1px; color: #fff; background: #e63b2e; border: none; border-radius: 10px; padding: 14px 26px; cursor: pointer; box-shadow: 0 4px 0 #8f1d12, 0 8px 20px rgba(0,0,0,.5); }
  .menu-buttons button:hover { background: #f4513f; transform: translateY(-1px); }
  .controls { font-size: 13px; color: rgba(255,255,255,.8); line-height: 1.6; max-width: 640px; }
  .fineprint { font-size: 12px; color: rgba(255,255,255,.55); }
  h2 { font-size: 64px; margin: 0; letter-spacing: 6px; font-weight: 900; color: #ff5a4d; text-shadow: 0 4px 0 #7a0f08, 0 8px 24px rgba(0,0,0,.7); }
  #end p { font-size: 18px; max-width: 560px; line-height: 1.55; }
  #end-stats { font-size: 17px; background: rgba(0,0,0,.45); border-radius: 10px; padding: 12px 22px; margin: 8px 0 4px; }
  #end-stats b { color: #ffd166; }
</style>
</head>
<body>
<canvas id="game" aria-label="SOLARA — Streets of Coral Bay: drive, steal cars, outrun the police and take eight story jobs across a sunset beach city"></canvas>
<div id="ui"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
